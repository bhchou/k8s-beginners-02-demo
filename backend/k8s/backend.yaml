apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-backend
  template:
    metadata:
      labels:
        app: demo-backend
    spec:
      containers:
        - name: backend
          image: docker.io/bhchoudev/k8s-beginners-02-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: ENV_NAME
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: ENV_NAME

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: API_KEY

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: k8s-demo
spec:
  type: ClusterIP
  selector:
    app: demo-backend
  ports:
    - port: 8000
      targetPort: 8000
